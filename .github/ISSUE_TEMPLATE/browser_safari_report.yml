name: Browser / Safari test report
description: Share a browser or Safari test result for a Rivinia package
title: "[Browser test]: "
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Safari 18.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "macOS 15.x"
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@rivinia/select 1.0.0-rc.3"
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario and steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Include expected and observed behavior, console errors, or screenshots where useful.
    validations:
      required: true
