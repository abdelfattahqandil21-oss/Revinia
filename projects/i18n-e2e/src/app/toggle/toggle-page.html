<main class="toggle-page">
  <h1 data-testid="toggle-title">{{ title() }}</h1>
  <p class="state" data-testid="toggle-state">{{ i18n.currentLanguage() }} · {{ i18n.dir() }}</p>

  <section id="direction-matrix">
    <h2>managed — RiviniaI18n as the manager</h2>
    <rv-language-toggle
      data-testid="managed-toggle"
      [manager]="i18n"
      [label]="label()"
      (languageChange)="onManagedChange($event)"
    />
    <p class="state" data-testid="managed-event">{{ managedEvent() ?? '—' }}</p>
  </section>

  <section id="presentational">
    <h2>presentational — rvLanguageTrigger template and a consumer icon</h2>

    <!--
      A consumer icon: static, so a template reference is enough. It is sized
      by the component's icon box and drawn in `currentColor`, so it inherits
      the button's colour, hover and disabled states without extra styling.
    -->
    <ng-template #swapIcon>
      <svg
        viewBox="0 0 64 64"
        fill="none"
        stroke="currentColor"
        stroke-width="5.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
        data-testid="custom-icon"
      >
        <path d="M10 24h36" />
        <path d="m38 16 8 8-8 8" />
        <path d="M54 40H18" />
        <path d="m26 32-8 8 8 8" />
      </svg>
    </ng-template>

    <rv-language-toggle
      data-testid="presentational-toggle"
      [languages]="presentationalLanguages"
      [current]="presentationalCurrent()"
      [icon]="swapIcon"
      label="Switch language"
      (languageChange)="onPresentationalChange($event)"
    >
      <!--
        The consumer owns this markup. The name is in the target language; the
        badge is English and carries its own `lang` plus `dir="auto"`, so its
        bidi follows its own text instead of the button's Arabic.

        The whole visible label is one element, and the comma sits in the name's
        run with its space: as the first character of an LTR badge the comma
        would be pushed to the far edge of an RTL button, and the flex gap would
        separate it from the name in both directions. `Switch language` + the
        name, comma and space included, stay exactly the accessible name
        ("<name>, Switch language").
      -->
      <ng-template rvLanguageTrigger let-language>
        <span class="toggle-name"
          >{{ language.nativeName }},
          <span class="toggle-badge" lang="en" dir="auto" data-testid="foreign-hint"
            >Switch language</span
          ></span
        >
      </ng-template>
    </rv-language-toggle>
    <p class="state" data-testid="presentational-event">{{ presentationalEvent() ?? '—' }}</p>
  </section>
</main>
